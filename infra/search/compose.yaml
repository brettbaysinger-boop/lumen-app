services:
  search:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${LUMEN_SEARCH_SECRET:?Generate a search secret first}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - search-cache:/var/cache/searxng
volumes:
  search-cache:
