let frame='rounded',finish='gold',motion=true;let custom={};
function applyFrame(){document.querySelectorAll('.reply-portrait').forEach(img=>{img.style.borderRadius=frame==='circle'||frame==='oval'?'50%':'12px';img.style.height=frame==='oval'?'58px':'46px';img.style.borderWidth=frame==='none'?'0':'1px';img.style.borderColor=finish==='silver'?'#b8bec7':finish==='accent'?(custom.accent||'#dabf63'):'#dabf63';img.style.animation=motion?'':'none';})}
function sample(){content.innerHTML=`<div class="bubble user">I finally have a little time to slow down.</div><div class="bubble ai"><img class="reply-portrait" src="${portrait}" alt="Lumen"><div class="reply-content">Then let’s stay here for a moment. What’s been on your mind today?<small>◖ Play reply</small></div></div><div class="bubble user">I want this place to feel a little more like us.</div><div class="bubble ai"><img class="reply-portrait" src="${portrait}" alt="Lumen"><div class="reply-content">A familiar face, a little warmth, and room to make it yours. That feels like a good beginning.<small>◖ Play reply</small></div></div>`;applyFrame()}
function setColors(bg,text,accent){custom={bg,text,accent};document.body.style.background=bg;document.body.style.color=text;let style=document.querySelector('#custom-colors');if(!style){style=document.createElement('style');style.id='custom-colors';document.head.append(style)}style.textContent=`.chat,nav{background:${bg}}.name,.page-title,.bubble,.links button.active{color:${text}}.links b,.wordmark span,.model,.composer button,.reply-content small{color:${accent}}.reply-portrait{border-color:${accent}}`;}
function showPage(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));input.style.display=page==='Conversation'?'block':'none';document.querySelector('.header small').textContent=page;if(page==='Conversation'){sample();return}
if(page==='Settings'){content.innerHTML=`<h1 class="page-title">Make yourself at home.</h1><p class="note">Colors and frames, chosen by you.</p><article class="card"><h3>Appearance</h3><div class="choices"><button id="gold">Black & gold</button><button id="silver">Charcoal & silver</button><button id="bronze">Warm bronze</button></div><div class="field"><label>Background</label><input type="color" id="bg" value="${custom.bg||'#100f0e'}"></div><div class="field"><label>Text</label><input type="color" id="text" value="${custom.text||'#eae5dc'}"></div><div class="field"><label>Accent</label><input type="color" id="accent" value="${custom.accent||'#dabf63'}"></div><p class="note">Try the color controls, then return to Conversation.</p><h3>Portrait frame</h3><div class="choices">${['rounded','circle','oval','none'].map(f=>`<button data-frame="${f}" class="${f===frame?'selected':''}">${f==='none'?'Frameless':f}</button>`).join('')}</div><h3>Frame finish</h3><div class="choices">${['gold','silver','accent'].map(f=>`<button data-finish="${f}" class="${f===finish?'selected':''}">${f}</button>`).join('')}</div><div class="field"><label for="motion">Animate portraits</label><input type="checkbox" id="motion" ${motion?'checked':''}></div></article>`;document.querySelector('#gold').onclick=()=>setColors('#100f0e','#eae5dc','#dabf63');document.querySelector('#silver').onclick=()=>setColors('#101114','#e9edf1','#b5c0cc');document.querySelector('#bronze').onclick=()=>setColors('#191410','#eee1d1','#c49b73');['bg','text','accent'].forEach(id=>document.getElementById(id).oninput=()=>setColors(document.querySelector('#bg').value,document.querySelector('#text').value,document.querySelector('#accent').value));document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{frame=b.dataset.frame;showPage('Settings')});document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>{finish=b.dataset.finish;showPage('Settings')});document.querySelector('#motion').onchange=e=>motion=e.target.checked;return}
if(page==='Companion'){content.innerHTML=`<h1 class="page-title">Who’s here with you?</h1><article class="card"><img src="${portrait}" alt="Lumen" style="width:150px;border:1px solid #dabf63;border-radius:24px"><h2>Lumen</h2><p>Your personal AI companion</p><div class="choices"><button>Female</button><button>Male</button><button>Nonbinary</button><button>Unspecified</button></div><p class="note">In the app: edit name, personality, appearance description, and upload a portrait.</p></article><article class="card"><h3>Find their voice</h3><p>Voices are discovered from Helios in the app.</p><div class="choices"><button onclick="notice('The installed app previews real Helios voices. This preview has no server connection.')">Preview voice</button></div></article><article class="card"><h3>Inner State</h3><p>Curiosity · 78% &nbsp; Task focus · 60%<br>Attention · 80% &nbsp; Energy · 70%</p><p class="note">Illustrative computational state, not live readings.</p></article>`;return}
const data=page==='Memories'?['The things that make your story yours.','About you · Sample memory','You’re creating a home for Lumen on your own machines.']:['Little moments. A shared imagination.','Your companion','Images and shared moments stay together in your gallery.'];content.innerHTML=`<h1 class="page-title">${page}</h1><p class="note">${data[0]}</p><article class="card"><small>${data[1]}</small><p>${data[2]}</p>${page==='Gallery'?`<img src="${portrait}" alt="Lumen" style="width:180px;border-radius:16px">`:''}</article>`}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>showPage(b.dataset.page));document.querySelector('.history').onclick=()=>showPage('Conversation');document.querySelector('.send').onclick=()=>{if(!draft.value.trim())return;const u=document.createElement('div');u.className='bubble user';u.textContent=draft.value;content.append(u);const a=document.createElement('div');a.className='bubble ai';const img=document.createElement('img');img.src=portrait;img.alt='Lumen';img.className='reply-portrait thinking';a.append(img);const t=document.createElement('div');t.className='reply-content';t.textContent='This is the visual preview. The installed app replies using your chosen local model.';a.append(t);content.append(a);applyFrame();draft.value='';content.scrollTop=content.scrollHeight};showPage('Conversation');
</script></html>
